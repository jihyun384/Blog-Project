<!DOCTYPE html>
<html lang="korean">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>포스트 수정</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
        <link rel="stylesheet" href="../public/css/style.css" />
        <link rel="stylesheet" href="../public/css/font.css" />
        <link rel="stylesheet" href="../public/css/form.css" />

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="../public/js/script.js"></script>
        <script src="../public/js/update.js"></script>
    </head>
    <body>
        <div class="container">
            <header class="lh-1 py-3">
                <div class="row flex-nowrap justify-content-between align-items-center">
                    <div class="col-4 pt-1"><a class="link-secondary" href="#"></a></div>
                        <a class="blog-header-logo text-body-emphasis text-decoration-none" href="index.html"><b>Blog</b></a>
                    </div>
                    <div class="col-4 d-flex justify-content-end align-items-center"></div>
                </div>
            </header>
        </div>

        <div class="container">
            <div class="mb-3">
                <input type="text" id="post-title" class="form-control form-control-lg" placeholder="제목" />
                <input type="text" id="post-subtitle" class="form-control form-control-lg mt-2" style="font-size: 17px" placeholder="부제목" />
            </div>

            <div class="mb-2">
                <div class="btn-toolbar" role="toolbar">
                    <div class="btn-group me-2" role="group">
                        <button type="button" id="btn-bold" class="btn btn-outline-secondary"><b>B</b></button>
                        <button type="button" id="btn-italic" class="btn btn-outline-secondary"><i>I</i></button>
                        <button type="button" id="btn-underline" class="btn btn-outline-secondary"><u>U</u></button>
                        <button type="button" id="btn-strike" class="btn btn-outline-secondary"><s>S</s></button>
                    </div>
                    <div class="btn-group me-2" role="group">
                        <button type="button" id="btn-ordered-list" class="btn btn-outline-secondary">OL</button>
                        <button type="button" id="btn-unordered-list" class="btn btn-outline-secondary">UL</button>
                    </div>
                    <div class="btn-group" role="group">
                        <input type="file" id="image-input" accept="image/*" class="form-control" />
                    </div>
                </div>
            </div>

            <div id="editor" contenteditable="true" spellcheck="false" class="border p-3 mb-3" style="min-height: 300px"></div>

            <div class="d-flex justify-content-end">
                <button id="cancel-btn" class="btn btn-outline-secondary me-2">작성 취소</button>
                <button id="complete-btn" class="btn btn-primary">수정 완료</button>
            </div>
        </div>

        <div class="modal fade" id="completeModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">포스트 발행 설정</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="cover-input" class="form-label">표지</label>
                            <div id="cover-preview" class="mb-2">
                                <img id="cover-img" src="" alt="표지 이미지" style="max-width: 100%; height: auto" />
                            </div>
                            <input type="file" class="form-control" id="cover-input" accept="image/*" />
                        </div>

                        <div class="mb-3">
                            <label for="category-input" class="form-label">카테고리</label>
                            <div id="category-container" class="form-control d-flex flex-wrap">
                                <input type="text" id="category-input" class="border-0 flex-grow-1" placeholder="카테고리 입력" />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                        <button id="submit-btn" type="button" class="btn btn-primary">포스트 재발행</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
