<!DOCTYPE html>
<html lang="korean">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>bolg</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
        <link rel="stylesheet" href="../public/css/style.css" />
        <link rel="stylesheet" href="../public/css/font.css" />
        <link rel="stylesheet" href="../public/css/post.css" />

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="../public/js/script.js"></script>
        <script src="../public/js/post.js"></script>
    </head>
    <body>
        <div class="container">
            <header class="lh-1 py-3">
                <div class="row flex-nowrap justify-content-between align-items-center">
                    <div class="col-4 pt-1"><a class="link-secondary" href="#"></a></div>
                    <div class="col-4 text-center">
                        <a class="blog-header-logo text-body-emphasis text-decoration-none" href="index.html"><b>Blog</b></a>
                    </div>
                    <div class="col-4 d-flex justify-content-end align-items-center"></div>
                </div>
            </header>
        </div>

        <main class="container mt-4">
            <div class="post-content p-4 rounded">
                <h2 class="fst"></h2>
                <h4 class="sbt"></h4>
                <div class="text-muted mb-4 pb-3 border-bottom" id="post-meta"></div>
                <div id="post-body" class="mb-5 mt-3"></div>

                <div id="post-categories" class="mt-3 mb-3 border-top py-3"></div>

                <div class="d-flex align-items-center mb-3">
                    <button id="like-btn" class="btn btn-outline-danger me-2"></button>
                    <a id="comment-btn" href="#" class="btn btn-outline-primary">댓글 보기</a>
                    <div id="owner-actions" class="ms-auto" style="display: none">
                        <button id="edit-btn" class="btn btn-sm btn-outline-secondary me-1">수정</button>
                        <button id="delete-btn" class="btn btn-sm btn-outline-danger">삭제</button>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button id="prev-btn" class="btn btn-outline-secondary">← 이전 글</button>
                    <button id="next-btn" class="btn btn-outline-secondary">다음 글 →</button>
                </div>
            </div>
        </main>
    </body>
</html>
